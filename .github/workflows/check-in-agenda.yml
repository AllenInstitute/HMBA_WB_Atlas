name: Check-in agenda draft

on:
  schedule:
    - cron: '0 16 * * 1'
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and generate on the runner only (no commit or content in logs)
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/check_in_agenda.py
      - tests/test_check_in_agenda.py
      - .github/workflows/check-in-agenda.yml

permissions:
  contents: read

concurrency:
  group: check-in-agenda
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  draft:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Gate the UTC triggers to Monday 9 AM Pacific
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            echo "run=$(python3 scripts/check_in_agenda.py --check-schedule "$SCHEDULE")" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate public-safe draft
        if: steps.schedule.outputs.run == 'true'
        env:
          PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python3 scripts/check_in_agenda.py --dry-run
          else
            python3 scripts/check_in_agenda.py
          fi
      - name: Commit only changed draft
        if: steps.schedule.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          if git diff --quiet -- email.md; then
            echo "Draft unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- email.md
          git commit -m "Update check-in agenda draft"
          git push origin HEAD:main
